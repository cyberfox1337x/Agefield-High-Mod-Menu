# cyberfox1337x.function("github_ci")
name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test application
        run: npm run test

      - name: Test runtime installer
        shell: powershell
        run: npm run test:runtime-installer

      - name: Build application
        run: npm run build

      - name: Validate article HTML
        run: npx --yes html-validate@10.0.0 "showcase/agefield-article/public/index.html" "showcase/agefield-article/public/404.html"
